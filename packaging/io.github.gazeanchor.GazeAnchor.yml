app-id: io.github.gazeanchor.GazeAnchor
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: gaze-anchor
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.kde.kglobalaccel
  - --filesystem=xdg-config/GazeAnchor:create
modules:
  - name: gaze-anchor
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_PROFILE=FULL
    sources:
      - type: dir
        path: ..
