app-id: io.github.motionstabilizer.MotionStabilizer
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: motion-stabilizer-linux
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.kde.kglobalaccel
  - --filesystem=xdg-config/MotionStabilizer:create
modules:
  - name: motion-stabilizer-linux
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_LAYER_SHELL_QT=ON
      - -DENABLE_KGLOBALACCEL=ON
      - -DENABLE_X11_FALLBACK=ON
    sources:
      - type: dir
        path: ..
